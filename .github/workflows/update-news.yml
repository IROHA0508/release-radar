name: 새 소식 자동 업데이트

on:
  schedule:
    - cron: "17 23 * * *"     # 매일 한국 시간 08:17
  workflow_dispatch:
    inputs:
      command:
        description: "update(감지+요약+반영) / detect(감지만, 파일 변경 없음) / selftest(소스 점검)"
        type: choice
        options: [update, detect, selftest]
        default: update
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "tests/**"
      - ".github/workflows/update-news.yml"

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt pytest
      - name: 오프라인 테스트
        run: python -m pytest tests -q
      - name: 실제 소스 자가 시험 (API 호출 없음)
        run: python -m backend selftest

  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_SUBSCRIPTION_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Claude Code CLI 설치 (구독 토큰을 쓰는 경우)
        if: env.HAS_SUBSCRIPTION_TOKEN == 'true'
        run: npm install -g @anthropic-ai/claude-code
      - name: 실행
        env:
          # 구독 토큰이 있으면 Claude Pro/Max 사용량으로 요약(API 과금 없음). 없을 때만 API 키 사용.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RR_MODEL: ${{ vars.RR_MODEL }}
          RR_TRIAGE_MODEL: ${{ vars.RR_TRIAGE_MODEL }}
        run: |
          [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && unset CLAUDE_CODE_OAUTH_TOKEN
          [ -z "$ANTHROPIC_API_KEY" ] && unset ANTHROPIC_API_KEY
          [ -z "$RR_MODEL" ] && unset RR_MODEL
          [ -z "$RR_TRIAGE_MODEL" ] && unset RR_TRIAGE_MODEL
          python -m backend "${{ github.event.inputs.command || 'update' }}"
      - name: 바뀐 데이터 커밋
        if: github.event.inputs.command != 'detect' && github.event.inputs.command != 'selftest'
        run: |
          git config user.name "release-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data backend/state
          if git diff --cached --quiet; then
            echo "바뀐 내용 없음"
            exit 0
          fi
          added=$(python -c "import json;r=json.load(open('backend/state/last-run.json'));print(', '.join(a['title'] for a in r['added']))")
          if [ -n "$added" ]; then msg="새 소식: $added"; else msg="마지막 확인 날짜 갱신"; fi
          git commit -m "$msg"
          git pull --rebase origin main
          git push origin HEAD:main
